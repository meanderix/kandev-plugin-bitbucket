id: "kandev-plugin-bitbucket"
api_version: 1
version: "0.3.0"
min_kandev_version: "0.88.0"
display_name: "Bitbucket"
description: "Connect Bitbucket Cloud or Data Center to native Kandev repository, pull-request, task, review, and watch workflows."
author: "kandev"
categories: ["connector"]
repo_url: "https://github.com/kdlbs/kandev-plugin-bitbucket"
icon: "assets/icon.svg"

# runtime.executables maps each supported platform to the binary kandev
# spawns as a gRPC subprocess. `make package` cross-compiles all five;
# `make package-host` builds just the current one. The paths are relative to
# the package root and must match what the Makefile writes into server/.
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  state: true
  secrets: true
  user_state: true
  api_read: ["tasks", "workspaces", "workflows", "agent_profiles", "repositories"]
  api_write: ["tasks"]

webhooks:
  - key: "oauth-callback"
    description: "Bitbucket OAuth callback; validates signed, single-use state and PKCE."
    method: "GET"

actions:
  - { key: "connection.get", scope: "workspace", max_body_bytes: 8192 }
  - { key: "connection.save", scope: "workspace", max_body_bytes: 65536 }
  - { key: "connection.disconnect", scope: "workspace", max_body_bytes: 8192 }
  - { key: "oauth.start", scope: "workspace", max_body_bytes: 8192 }
  - { key: "repositories.list", scope: "workspace", max_body_bytes: 8192 }
  - { key: "repositories.branches", scope: "workspace", max_body_bytes: 16384 }
  - { key: "repositories.inspect", scope: "workspace", max_body_bytes: 16384 }
  - { key: "pullrequests.queue", scope: "workspace", max_body_bytes: 65536 }
  - { key: "pullrequests.associations", scope: "workspace", max_body_bytes: 8192 }
  - { key: "pullrequests.search", scope: "workspace", max_body_bytes: 65536 }
  - { key: "pullrequests.get", scope: "task", max_body_bytes: 65536 }
  - { key: "pullrequests.inspect", scope: "workspace", max_body_bytes: 65536 }
  - { key: "pullrequests.link", scope: "task", max_body_bytes: 32768 }
  - { key: "pullrequests.unlink", scope: "task", max_body_bytes: 32768 }
  - { key: "pullrequests.create", scope: "task", max_body_bytes: 65536 }
  - { key: "reviews.get", scope: "workspace", max_body_bytes: 65536 }
  - { key: "reviews.action", scope: "task", max_body_bytes: 32768 }
  - { key: "tasks.launch", scope: "workspace", max_body_bytes: 65536 }
  - { key: "watches.get", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.update", scope: "workspace", max_body_bytes: 32768 }
  - { key: "watches.create", scope: "workspace", max_body_bytes: 32768 }
  - { key: "watches.filter", scope: "workspace", max_body_bytes: 32768 }
  - { key: "watches.preset", scope: "workspace", max_body_bytes: 32768 }
  - { key: "watches.run", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.pause", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.resume", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.preview_reset", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.preview_delete", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.reset", scope: "workspace", max_body_bytes: 8192 }
  - { key: "watches.delete", scope: "workspace", max_body_bytes: 8192 }

repository_providers: ["bitbucket"]
reference_sources:
  - source: "bitbucket"
    provider: "bitbucket"
    kind: "pull_request"
    display_name: "Bitbucket pull requests"
    kind_label: "Pull request"
    order: 30

ui:
  bundle: "/ui/bundle.js"
  styles: ["/ui/plugin.css"]

automation_conditions:
  - key: "pull_request_opened"
    verification_headers: ["x-hub-signature", "x-event-key"]
    access: "public"
    config_version: 1
    label: "New pull requests"
    label_key: "automationPullRequestOpened"
    description: "Receive signed Bitbucket events for the selected repository."
    description_key: "automationWebhookDescription"
    default_config:
      repository: ""
    config_schema:
      type: "object"
      required: ["repository"]
      properties:
        repository:
          type: "string"
          title: "Repository (workspace/repository or PROJECT/repository)"
          title_key: "automationRepository"
        branches:
          type: "array"
          items: {type: "string"}
          title: "Branches (one per line; empty matches all)"
          title_key: "automationBranches"
  - key: "pull_request_merged"
    verification_headers: ["x-hub-signature", "x-event-key"]
    access: "public"
    config_version: 1
    label: "Pull request merged"
    label_key: "automationPullRequestMerged"
    description: "Receive signed Bitbucket events for the selected repository."
    description_key: "automationWebhookDescription"
    default_config:
      repository: ""
    config_schema:
      type: "object"
      required: ["repository"]
      properties:
        repository:
          type: "string"
          title: "Repository (workspace/repository or PROJECT/repository)"
          title_key: "automationRepository"
        branches:
          type: "array"
          items: {type: "string"}
          title: "Branches (one per line; empty matches all)"
          title_key: "automationBranches"
  - key: "push"
    verification_headers: ["x-hub-signature", "x-event-key"]
    access: "public"
    config_version: 1
    label: "Push to branch"
    label_key: "automationPush"
    description: "Receive signed Bitbucket events for the selected repository."
    description_key: "automationWebhookDescription"
    default_config:
      repository: ""
    config_schema:
      type: "object"
      required: ["repository"]
      properties:
        repository:
          type: "string"
          title: "Repository (workspace/repository or PROJECT/repository)"
          title_key: "automationRepository"
        branches:
          type: "array"
          items: {type: "string"}
          title: "Branches (one per line; empty matches all)"
          title_key: "automationBranches"
  - key: "ci_result"
    verification_headers: ["x-hub-signature", "x-event-key"]
    access: "public"
    config_version: 1
    label: "CI check result"
    label_key: "automationCI"
    description: "Receive signed Bitbucket events for the selected repository."
    description_key: "automationWebhookDescription"
    default_config:
      repository: ""
    config_schema:
      type: "object"
      required: ["repository"]
      properties:
        repository:
          type: "string"
          title: "Repository (workspace/repository or PROJECT/repository)"
          title_key: "automationRepository"
        conclusions:
          type: "array"
          items: {type: "string"}
          title: "Results (successful, failed, stopped; one per line)"
          title_key: "automationConclusions"
